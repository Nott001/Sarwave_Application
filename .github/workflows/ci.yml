name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format python3-pip
          pip install editorconfig-checker --break-system-packages

      - name: Check clang-format
        run: |
          CLANG_FORMAT=$(command -v clang-format || command -v clang-format-17 || command -v clang-format-18 || true)
          FORMAT_FILES=$(find include src tools \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \))
          if [ -n "$CLANG_FORMAT" ] && [ -n "$FORMAT_FILES" ]; then
            $CLANG_FORMAT --dry-run --Werror -style=file $FORMAT_FILES
          else
            echo "clang-format not found, skipping"
          fi

      - name: Check editorconfig
        # Kept byte for byte, so not checked: test fixtures hold program output verbatim, the
        # configs/*.cfg files are TI's (CRLF, trailing spaces) and the config parity test reads
        # them as they are, and docs/*.html are TI's pages saved as they are.
        run: |
          ec -exclude "build|\.git/|src/tests/data/|SarwaveApplication/|configs/.*\.cfg$|docs/.*\.html$|\.(ttf|ico|swrec|bin|pdf)$" -f github-actions

  build-and-test:
    needs: lint-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 libboost-dev libgl-dev libxkbcommon-dev

      # Ubuntu's own Qt is 6.4; the code needs 6.5+ (loadFromModule, QML_VALUE_TYPE).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --verbose
